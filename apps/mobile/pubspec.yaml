name: rcode_mobile
description: "RCode for Android and iOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  ffi: ^2.2.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.2
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  highlight: ^0.7.0
  image: ^4.12.0
  image_picker: ^1.2.4
  markdown: ^7.3.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Geist-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Geist-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Geist-BoldItalic.ttf
          weight: 700
          style: italic
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GeistMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/GeistMono-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/GeistMono-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/GeistMono-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/GeistMono-BoldItalic.ttf
          weight: 700
          style: italic
