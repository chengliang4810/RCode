[package]
name = "rcode-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Installed extensions: a manifest, the contribution directories beside it, and
# the enable state. Deliberately dependency-free of the crates it feeds — it
# hands out *paths*, and each consumer reads them with its own parser, so a
# plugin cannot smuggle a type past a boundary.
[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
rcode-github.workspace = true
anyhow.workspace = true
reqwest.workspace = true
tokio.workspace = true
tempfile.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
