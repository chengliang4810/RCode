[package]
name = "rcode-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Portable Luau, GPU, text and math rendering for Flutter's Android/iOS client.
# The owned C ABI is in flutter_visual.rs; no platform binding generator is needed.
[lib]
name = "rcode_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
tokio.workspace = true
rcode-markdown.workspace = true
rcode-text.workspace = true
rcode-visual.workspace = true
rcode-visual-gpu.workspace = true
rcode-doc.workspace = true
rcode-proto.workspace = true
rcode-presentation.workspace = true
rcode-client.workspace = true
rcode-rpc.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
rcode-syntax.workspace = true
zatex = { workspace = true, features = ["bundled"] }
