[package]
name = "rcode-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Hook matchers may be regular expressions, as Claude Code's are.
regex = "1"
rcode-proto.workspace = true
# The native driver (`src/native.rs`) is the adapter over this crate's ReAct
# loop; see ARCHITECTURE.md section 5.
rcode-agent.workspace = true
rcode-model.workspace = true
# MCP tools are registered as ordinary tools this driver calls.
rcode-mcp.workspace = true
# Installed plugins contribute skill/agent roots, hooks and MCP servers.
rcode-plugins.workspace = true
# Provider endpoints are parsed into URLs before a client is built.
url = "2"
base64 = "0.22"
tokio.workspace = true
tokio-util = { workspace = true, features = ["io-util", "codec"] }
uuid.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
chrono.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
reqwest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
