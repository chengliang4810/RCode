[package]
name = "rcode-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rcode-preview.workspace = true
rcode-proto.workspace = true
rcode-doc.workspace = true
rcode-sync.workspace = true
rcode-harness.workspace = true
rcode-agent.workspace = true
rcode-mcp.workspace = true
rcode-plugins.workspace = true
rcode-rpc.workspace = true
rcode-update.workspace = true
rcode-visual.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
toml = "0.8"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
ignore.workspace = true
fff-search.workspace = true

same-file = "1"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
rcode-client.workspace = true
tracing-subscriber.workspace = true
rcode-harness.workspace = true
# Paused-clock tests (the 30-minute idle reaper).
tokio = { workspace = true, features = ["test-util"] }
zip.workspace = true
tokio-tungstenite.workspace = true
# In-process registry server for the two-engine workspace integration tests.
rcode-sync = { workspace = true, features = ["mock-server"] }
