[package]
name = "rcode-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The official Rust SDK: stdio transports for local servers, and the
# streamable-HTTP client for remote ones.
rmcp = { version = "3.5", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
# The bridge implements `rcode_agent::Tool`, so the loop never learns MCP
# exists. The dependency runs one way: agent does not depend on this crate.
rcode-agent.workspace = true
# Plugin-contributed servers are part of the same list.
rcode-plugins.workspace = true
async-trait.workspace = true
# Header names/values for a remote server's `headers`.
http = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-util.workspace = true
