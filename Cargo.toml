[workspace]
resolver = "2"
members = [
    "crates/veil",
    "crates/theme",
    "crates/proto",
    "crates/presentation",
    "crates/preview",
    "crates/doc",
    "crates/sync",
    "crates/harness",
    "crates/engine",
    "crates/rpc",
    "crates/update",
    "crates/ui",
    "crates/syntax",
    "crates/markdown",
    "crates/mobile",
    "crates/client",
    "crates/text",
    "crates/model",
    "crates/agent",
    "crates/mcp",
    "crates/visual",
    "crates/visual-gpu",
    "crates/zatex",
    "crates/plugins",
    "crates/github",
    "apps/rcode",
]

[workspace.package]
version = "0.0.2-beta.2"
edition = "2024"
license = "MIT"
publish = false

# The pinned Windows backend only searches installed fonts for fallbacks.
# Keep bundled CJK faces process-local and include their custom collection.
[patch."https://github.com/zeronsh/zui"]
gpui_windows = { path = "vendor/gpui_windows" }
gpui = { path = "vendor/gpui" }

# Keep stacksafe 0.1.x while using maintained procedural-macro diagnostics.
[patch.crates-io]
stacksafe-macro = { path = "vendor/stacksafe-macro" }
# Preserve Loro's data model while applying container memory-safety fixes.
sized-chunks = { path = "vendor/sized-chunks" }
taffy = { path = "vendor/taffy" }
loro-internal = { path = "vendor/loro-internal" }

[workspace.dependencies]
rcode-veil = { path = "crates/veil" }
rcode-proto = { path = "crates/proto" }
rcode-presentation = { path = "crates/presentation" }
rcode-preview = { path = "crates/preview" }
rcode-doc = { path = "crates/doc" }
rcode-sync = { path = "crates/sync" }
rcode-harness = { path = "crates/harness" }
rcode-engine = { path = "crates/engine" }
rcode-rpc = { path = "crates/rpc" }
rcode-update = { path = "crates/update" }
rcode-ui = { path = "crates/ui" }
rcode-syntax = { path = "crates/syntax" }
rcode-markdown = { path = "crates/markdown" }
rcode-mobile = { path = "crates/mobile" }
rcode-client = { path = "crates/client" }
rcode-theme = { path = "crates/theme" }
rcode-text = { path = "crates/text" }
rcode-model = { path = "crates/model" }
rcode-agent = { path = "crates/agent" }
rcode-mcp = { path = "crates/mcp" }
zatex = { path = "crates/zatex" }
rcode-visual = { path = "crates/visual" }
rcode-visual-gpu = { path = "crates/visual-gpu" }
rcode-plugins = { path = "crates/plugins" }
rcode-github = { path = "crates/github" }

# CRDT
loro = "1.13"
# Loro wire-protocol primitives.
loro-protocol = "0.3"

# gpui — zeronsh/zui, extracted from wingleeio/zed e2ddcc6 with identical
# crate sources; adds bounded blur passes and shared Gaussian weights.
# Removes GPL tracing crates and composites deferred GPUI content above native macOS views.
# Preserved fork history: upstream f14fea9 + commits on
# `comet/edge-fade-horizontal` (tip of `comet/line-wrap-closing-punctuation`
# + 5d1f83d horizontal per-pixel EdgeFade for quads/images; rebase when bumping the
# upstream rev): a6bf17c fixes BOTH wrap-rule copies (LineWrapper +
# line_layout's shaped-text duplicate); 14baea0 adds the EdgeFade primitive
# (Window::with_edge_fade — per-primitive scroll-edge fades for the glass
# sidebar); a6c1ad5 adds BackdropBlur + horizontal EdgeFade + glass fixes;
# 9b672fa bounds renderer GPU memory (region-sized backdrop blur scratch,
# idle release of blur/path intermediates, instance pool shrink,
# RCODE_GPU_STATS=1 diagnostics); b687328 adds ImageSource::evict (frees
# sprite-atlas tiles — remove_asset alone leaked them, see
# attachments::flush_evicted); ac135eb adds device memory to the stats line;
# f596cde fixes destination alpha on transparent windows (Porter-Duff OVER,
# not additive); 53518c0 merges the edge-fade line: per-edge fade bands +
# per-pixel EdgeFade for quads/images (true fade-into-glass), and
# object-fit Cover cropping via atlas-tile UVs so image corner radii hold;
# 8a8954c switches the macOS blurred view to UnderWindowBackground (macOS 26
# stopped vending CABackdropLayer for Selection — window blur went dead);
# b68970e rasterizes BackdropBlur in the wgpu renderer (frosted floats on
# Linux — the Metal path's snapshot/blur/composite, ported).
# Paint-time rounded image masks (#9), bounded Windows backdrop blur and
# translucent compositing, plus blur-aware scene batching (#10).
# Per-pixel rounded clipping (`Window::with_rounded_clip`, 361ff20).
gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui-base = { git = "https://github.com/zeronsh/gpui-component", rev = "701ca97af7983bf85343d2d1d404ab528b18ec96" }

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
plist = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
# macOS uses mimalloc v2 to reduce retained streaming/render allocations.
# Other platforms keep their system allocator.
mimalloc = { version = "0.1", features = ["v2"] }
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
notify = "7"
portable-pty = "0.9"
alacritty_terminal = "0.26"
pulldown-cmark = "0.12"
unicode-segmentation = "1"
unicode-width = "0.2"
fontdb = "0.23"
ttf-parser = "0.25.1"
# Packaged GUI apps do not inherit shell proxy variables; honor the macOS and
# Windows system proxy for provider usage probes and other HTTP clients.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
ignore = "0.4"
# Workspace file/content search index (@ mentions, file tree, cmd+K).
# Pinned exactly: crates.io also carries `0.11.1-nightly.*` prereleases.
fff-search = "=0.11.0"

[profile.release]
# Distribution profile (scripts/package-linux.sh / package-windows.ps1).
# Thin LTO was dropped for fat LTO: with codegen-units = 1 the whole crate is a
# single CGU anyway, so fat LTO is what actually lets the inliner see across
# crate boundaries. Measured on Windows x86_64 (2026-10-12): baseline
# thin+cgu16 166.2MB -> +compression 165.8MB -> +codegen-units=1 154.9MB
# -> +lto=fat 150.5MB. Cost is link time (20m -> 17m -> 31m cold).
# opt-level = "s" would save a further ~29MB (-> 121.5MB) by shrinking .text
# from 92MB to 67MB, but deliberately stays unset: this is a GPUI render app
# with hot rendering paths, and the size win is a runtime-speed trade the
# product owner has to make, not a free one.
lto = "fat"
strip = "symbols"
codegen-units = 1

[profile.dev]
# gpui is slow unoptimized; match zed's approach for deps
opt-level = 0
# Line tables instead of full debug info. The default emitted ~12 GB of PDBs
# in `target/debug` on a machine that was already tight on disk, and what they
# bought over this is stepping into locals — backtraces and `file:line` are
# unchanged. Release is untouched.
debug = 1

[profile.dev.package."*"]
opt-level = 2

# Scenes rasterize in software every frame the camera moves.
[profile.dev.package.rcode-visual]
opt-level = 3

[profile.dev.package.rcode-visual-gpu]
opt-level = 3

# Portable rendering (apps/mobile/native). Always optimized — Luau, layout,
# math and GPU rendering run on the phone's hot paths, including Debug apps.
[profile.mobile]
inherits = "release"
lto = false
strip = false
debug = "line-tables-only"
incremental = true
codegen-units = 16

# TestFlight/App Store archives.
[profile.mobile-dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
