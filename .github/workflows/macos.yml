name: macOS tests

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'scripts/test-browser-storage.py'
      - 'scripts/ci/run-macos-fixture.sh'
      - 'scripts/mobile/test-ios.sh'
      - 'scripts/fixtures/preview-server/**'
      - 'dist/macos/Info.plist'
      - 'apps/mobile/**'
      - '.github/workflows/macos.yml'
      - '.github/actions/flutter-setup/**'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'scripts/test-browser-storage.py'
      - 'scripts/ci/run-macos-fixture.sh'
      - 'scripts/mobile/test-ios.sh'
      - 'scripts/fixtures/preview-server/**'
      - 'dist/macos/Info.plist'
      - 'apps/mobile/**'
      - '.github/workflows/macos.yml'
      - '.github/actions/flutter-setup/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tests run on the dev profile (workspace crates at opt-level 0, dependencies at 2 as configured in
  # Cargo.toml) instead of --release: a cold build is several times cheaper. No debug info is needed.
  CARGO_PROFILE_DEV_DEBUG: 0

# Every macOS job starts with `rustup update stable`: runner images are not uniform (one image may ship
# rustc 1.98.0 and another 1.98.1) and rust-cache keys include the rustc version, so a job that lands
# on an older image would otherwise miss the cache that `main` seeded.
jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.result }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: filter
        with:
          script: |
            // Preserve mobile coverage for main pushes and manual runs.
            if (context.eventName !== 'pull_request') return true;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // Run conservatively if the API did not return the full diff.
            if (files.length < context.payload.pull_request.changed_files) return true;
            // The app links the Rust mobile core and everything it depends on.
            const mobileCore = ['crates/mobile/', 'crates/client/', 'crates/text/', 'crates/markdown/',
              'crates/doc/', 'crates/sync/', 'crates/proto/', 'crates/rpc/', 'crates/syntax/',
              'crates/visual/', 'crates/visual-gpu/', 'crates/canvas/', 'crates/scene/', 'crates/shader/',
              'crates/engine/', 'crates/harness/', 'crates/model/', 'crates/agent/', 'crates/presentation/'];
            const affectsMobile = path => path?.startsWith('apps/mobile/')
              || mobileCore.some(prefix => path?.startsWith(prefix))
              || path === 'Cargo.lock'
              || path === 'Cargo.toml'
              || path === 'rust-toolchain.toml'
              || path === 'scripts/mobile/test-ios.sh'
              || path === '.github/workflows/macos.yml'
              || path?.startsWith('.github/actions/flutter-setup/');
            return files.some(file => affectsMobile(file.filename)
              || affectsMobile(file.previous_filename));

  # Updater and preview tests, native UI regressions and the two native WebKit fixtures. Everything is
  # compiled once (one cargo invocation, so dependencies are built once) and then run.
  macos-native:
    runs-on: macos-latest
    # A cold cache (first run, eviction, toolchain bump) takes about 32 minutes; warm is about 10.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install cargo-nextest
        run: |
          # Pinned release, verified against a checksum.
          version=0.9.146
          sha256=39785160b3c2f6ed9a765049cf4fa79f3b39aa02eb7598a5a0e2a1a0b9ffb9a8
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 -o "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/cargo-nextest-$version-universal-apple-darwin.tar.gz"
          echo "$sha256  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin" cargo-nextest
      - name: Build tests and fixtures
        run: |
          cargo nextest run --no-run --locked \
            -p rcode-update -p rcode-preview -p rcode-ui -p rcode-text \
            --features rcode-ui/browser-fixture --lib --tests
          cargo build --locked -p rcode-update -p rcode-preview -p rcode-ui \
            --features rcode-ui/browser-fixture --example browser-fixture --example preview-fixture
      - name: Check macOS application
        env:
          # Match the old `cargo check --release`: no debug assertions.
          CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: false
        run: cargo check --locked -p rcode
      - name: Updater, preview, CoreText and native UI regressions
        run: |
          # rcode-text's coretext tests are macOS-only (#![cfg(target_os = "macos")]); its other
          # tests run on Linux in mobile-core. The attachment filters cover file staging, chips and
          # external Finder drops, whose paths and file metadata are platform-specific.
          cargo nextest run --no-fail-fast --locked \
            -p rcode-update -p rcode-preview -p rcode-ui -p rcode-text \
            --features rcode-ui/browser-fixture --lib --tests \
            -E 'package(rcode-update) | package(rcode-preview) | binary_id(rcode-text::coretext) | (binary_id(rcode-ui) & (test(native_diff_font_geometry) | test(/notify::tests::/) | test(/^attachments::tests::/) | test(/composer::attachment_chip_tests::/) | test(/shell::chat_dropzone_tests::/) | test(=queue::tests::queue_rows_label_attachment_chips_and_file_only_sends) | test(=transcript::tests::user_bubbles_project_attachment_chips_in_place_of_the_strip) | test(=transcript::tests::sent_chips_show_upload_progress_until_their_bytes_land)))'
      - name: Native browser regression and screenshots
        timeout-minutes: 7
        env:
          RUST_BACKTRACE: 1
          FIXTURE_ATTEMPT_TIMEOUT: 110
        run: |
          scripts/ci/run-macos-fixture.sh target/debug/examples/browser-fixture "$RUNNER_TEMP/browser-captures"
          test -f "$RUNNER_TEMP/browser-captures/result.txt"
      - name: Persistent browser profiles across app launches
        timeout-minutes: 5
        run: python3 scripts/test-browser-storage.py --fixture target/debug/examples/browser-fixture
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-macos-captures
          path: ${{ runner.temp }}/browser-captures*
          if-no-files-found: ignore
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/fixtures/preview-server/package-lock.json
      - name: Install preview fixture server
        run: npm ci --prefix scripts/fixtures/preview-server
      - name: Project discovery, stable URLs and HMR in native WebKit
        timeout-minutes: 5
        env:
          RCODE_PREVIEW_AUTO_OPEN: 1
        run: |
          VITE_BINARY="$GITHUB_WORKSPACE/scripts/fixtures/preview-server/node_modules/vite/bin/vite.js" scripts/ci/run-macos-fixture.sh target/debug/examples/preview-fixture "$RUNNER_TEMP/preview-captures"
          test -f "$RUNNER_TEMP/preview-captures/result.txt"
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-macos-captures
          path: ${{ runner.temp }}/preview-captures*
          if-no-files-found: ignore

  # gpui_macos lives in the pinned GPUI checkout, a separate workspace with its own cache.
  macos-frame-source:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup show active-toolchain || rustup toolchain install
      - name: Check out pinned GPUI for native frame-source tests
        shell: bash
        run: |
          rev=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["dependencies"]["gpui"]["rev"])')
          git init frame-source-tests
          git -C frame-source-tests remote add origin https://github.com/zeronsh/zui
          git -C frame-source-tests fetch --depth=1 origin "$rev"
          git -C frame-source-tests checkout --detach FETCH_HEAD
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
          workspaces: frame-source-tests
      - name: Native frame-source recovery regression
        working-directory: frame-source-tests
        run: cargo test --locked -p gpui_macos --test frame_source_recovery

  mobile-core:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: ./.github/actions/flutter-setup
      - name: Rust mobile regressions
        run: cargo test --locked -p rcode-text -p rcode-markdown -p rcode-client -p rcode-mobile
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter application
        working-directory: apps/mobile
        run: flutter analyze --no-pub
      - name: Flutter unit and widget regressions
        working-directory: apps/mobile
        run: flutter test --no-pub --concurrency=1
      - name: Dart controllers against a real authenticated engine
        run: cargo test --locked -p rcode-engine --test flutter_direct -- --ignored --nocapture

  # Keep an unsigned shipping-app build, then execute the integration target on
  # a dedicated simulator with a real local engine and native Rust rendering.
  mobile-ios:
    needs: [changes, mobile-core, macos-frame-source]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain and simulator targets
        run: |
          rustup update stable --no-self-update
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: ./.github/actions/flutter-setup
      - name: Xcode version
        run: xcodebuild -version
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Build Flutter iOS simulator app
        working-directory: apps/mobile
        run: flutter build ios --debug --simulator --no-codesign --no-pub
      - name: Run iOS simulator against the authenticated engine
        timeout-minutes: 45
        env:
          RCODE_MOBILE_QA_ARTIFACTS: ${{ runner.temp }}/rcode-mobile-ios-runtime
        run: bash scripts/mobile/test-ios.sh
      - name: Upload iOS runtime screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rcode-mobile-ios-runtime
          path: ${{ runner.temp }}/rcode-mobile-ios-runtime
          if-no-files-found: ignore

  mobile-android:
    needs: [changes, mobile-core]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: ./.github/actions/flutter-setup
      - name: Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Android NDK
        run: sdkmanager 'ndk;27.0.12077973'
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Build Flutter Android APK
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub --target-platform android-arm64,android-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rcode-mobile-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
